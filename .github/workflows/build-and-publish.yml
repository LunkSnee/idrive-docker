name: Build and Publish

on:
  push:
    branches: [main]
    paths:
      - "idrive/build/**"
  schedule:
    - cron: "12 9 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-docker-image:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Sanitize Repository Name
        id: sanitize
        env:
          RAW_IMAGE_NAME: ${{ github.repository }}
        run: |
          echo "IMAGE_LOWERCASE=$(echo $RAW_IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Get iDrive version
        id: version
        # Don't let a version-check outage skip base-image checks and the build below;
        # the failure still shows up as a warning on this step, and downstream steps
        # already guard on idrive_version/idrive_URL being empty.
        continue-on-error: true
        run: ./idrive/version.sh

      - name: Prepare build args
        id: build-args
        run: |
          # Only pass IDRIVE_URL if the version-check resolved one; otherwise the
          # Dockerfile's own ARG default is used.
          if [ -n "${{ steps.version.outputs.idrive_URL }}" ]; then
            echo "args=IDRIVE_URL=${{ steps.version.outputs.idrive_URL }}" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: Check DockerHub Secrets
        id: check-secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Github Packages (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- NEW: Check if the image currently exists in the registry ---
      - name: Check if image exists in GHCR
        id: check-image
        if: github.event_name != 'push'
        run: |
          # Redirects output to null. If it succeeds, the image exists. If it fails, it does not.
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:latest"
          if docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # --- UPDATED: Only run update checkers if the image already exists ---
      - name: Check for new base image
        if: github.event_name != 'push' && steps.check-image.outputs.exists == 'true'
        id: check-base
        uses: lucacome/docker-image-update-checker@v3.1.0
        with:
          base-image: debian:bookworm-slim
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:latest

      - name: Check for new iDrive version
        if: github.event_name != 'push' && steps.check-image.outputs.exists == 'true'
        id: check-version
        uses: tyriis/docker-image-tag-exists@v2.1.0
        with:
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.IMAGE_LOWERCASE }}
          tag: ${{ steps.version.outputs.idrive_version }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Generate Dynamic Docker Tags
        id: generate-tags
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:latest"
      
          # Append registry version tag ONLY if the version was detected
          if [ -n "${{ steps.version.outputs.idrive_version }}" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:${{ steps.version.outputs.idrive_version }}"
          fi

          # Append DockerHub tags only if DockerHub secrets are present
          if [ "${{ steps.check-secrets.outputs.has_secrets }}" == "true" ]; then
            TAGS="$TAGS,$DOCKER_USER/idrive-docker:latest"
            if [ -n "${{ steps.version.outputs.idrive_version }}" ]; then
              TAGS="$TAGS,$DOCKER_USER/idrive-docker:${{ steps.version.outputs.idrive_version }}"
            fi
          fi
    
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
    
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tags<<$EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      # --- UPDATED: Trigger build if push, base update, version update, OR missing image ---
      - name: Build image and push
        if: >
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.check-image.outputs.exists == 'false' ||
          steps.check-base.outputs.needs-updating == 'true' ||
          steps.check-version.outputs.tag == 'not found'
        uses: docker/build-push-action@v7
        with:
          context: idrive/build
          tags: ${{ steps.generate-tags.outputs.tags }}
          build-args: ${{ steps.build-args.outputs.args }}
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "**Event:** ${{ github.event_name }}"
            echo "**iDrive version detected:** ${{ steps.version.outputs.idrive_version || 'no (version-check failed)' }}"
            echo "**Image already exists:** ${{ steps.check-image.outputs.exists || 'n/a (push event)' }}"
            echo "**Base image needs updating:** ${{ steps.check-base.outputs.needs-updating || 'n/a' }}"
            echo "**Existing version tag found:** ${{ steps.check-version.outputs.tag || 'n/a' }}"
            echo "**Built:** ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check-image.outputs.exists == 'false' || steps.check-base.outputs.needs-updating == 'true' || steps.check-version.outputs.tag == 'not found' }}"
          } >> $GITHUB_STEP_SUMMARY
