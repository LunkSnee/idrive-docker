name: Build and Publish

# Builds the image and publishes it to GHCR (and Docker Hub when its secrets are set).
#   decide:  resolve the current IDrive release and decide whether anything needs building
#            (new IDrive version, new Debian base image, a change in this repo, or a manual run)
#   verify:  build each architecture on a native runner and run tests/smoke-test.sh against it
#   build-and-push-docker-image: publish the version tag (main only, after verify passed) and
#            move :latest once the release is old enough (LATEST_MIN_AGE_DAYS)

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-and-publish.yml"
  # Every pull request that touches the image is built and tested, never pushed
  # (no branch filter, so stacked PRs are tested too).
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-and-publish.yml"
  schedule:
    - cron: "12 9 * * *"
  workflow_dispatch:
    inputs:
      promote_version:
        description: "Roll :latest back to an already-published version tag (e.g. 3.15.0 or 3.15.0-r2). Bypasses the age gate and skips building. Leave empty for a normal run."
        required: false
        type: string

# Serialize builds so a manual dispatch overlapping the daily schedule can't race
# to push :latest, with the slower run silently winning.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # How many days an iDrive release must have been public before :latest is moved
  # onto it. Version tags are always published immediately; only :latest waits, so a
  # release that turns out to be bad does not reach :latest users on day one.
  LATEST_MIN_AGE_DAYS: 7
  # Versions :latest must never be promoted onto, regardless of age. The age gate
  # above only *delays* a release; it cannot know one is broken, so a version known
  # to be bad would sail through once it aged past the threshold. Space-separated,
  # e.g. "3.21.0 3.22.0". Commas do NOT work -- the value is split on whitespace.
  BLOCKED_VERSIONS: ""

jobs:
  decide:
    name: Resolve iDrive version and decide whether to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      reason: ${{ steps.decide.outputs.reason }}
      idrive_version: ${{ steps.version.outputs.idrive_version }}
      idrive_URL: ${{ steps.version.outputs.idrive_URL }}
      idrive_release_date: ${{ steps.version.outputs.idrive_release_date }}
      idrive_age_days: ${{ steps.version.outputs.idrive_age_days }}
      image_exists: ${{ steps.check-image.outputs.exists }}
      base_stale: ${{ steps.check-base.outputs.needs-updating }}
      version_tag: ${{ steps.check-version.outputs.tag }}
      revision: ${{ steps.revision.outputs.revision }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, so every v<version>-r<N> release tag is visible when numbering.
          fetch-depth: 0

      - name: Sanitize Repository Name
        env:
          RAW_IMAGE_NAME: ${{ github.repository }}
        run: |
          echo "IMAGE_LOWERCASE=$(echo "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          # Bare repo name (no owner), used for the image title label.
          echo "REPO_NAME=${RAW_IMAGE_NAME#*/}" >> "$GITHUB_ENV"

      - name: Get iDrive version
        id: version
        run: ./scripts/version.sh

      - name: Login to Github Packages (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW: Check if the image currently exists in the registry ---
      # Each published build gets an immutable <version>-r<N> tag and a matching
      # v<version>-r<N> GitHub Release. N is one more than the highest existing release
      # tag for this version, and also skips any revision already in the registry (a run
      # that pushed images but failed before creating its release leaves no git tag).
      - name: Compute image revision
        id: revision
        env:
          VERSION: ${{ steps.version.outputs.idrive_version }}
          EVENT: ${{ github.event_name }}
        run: |
          rev=0
          while IFS= read -r tag; do
            n="${tag#"v${VERSION}-r"}"
            case "$n" in ''|*[!0-9]*) continue ;; esac
            n=$((10#$n))
            [ "$n" -gt "$rev" ] && rev="$n"
          done < <(git tag -l "v${VERSION}-r*")
          rev=$((rev + 1))
          if [ "$EVENT" != "pull_request" ]; then
            while docker manifest inspect "${REGISTRY}/${IMAGE_LOWERCASE}:${VERSION}-r${rev}" >/dev/null 2>&1; do
              rev=$((rev + 1))
            done
          fi
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "Next image revision: ${VERSION}-r${rev}"

      - name: Check if image exists in GHCR
        id: check-image
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: |
          # Redirects output to null. If it succeeds, the image exists. If it fails, it does not.
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:latest"
          if docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # --- UPDATED: Only run update checkers if the image already exists ---
      - name: Check for new iDrive version
        if: github.event_name != 'push' && github.event_name != 'pull_request' && steps.check-image.outputs.exists == 'true'
        id: check-version
        uses: tyriis/docker-image-tag-exists@e73c8fdfab85076cdcf2ce4b443181fae2153675 # v2026.6.0
        with:
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.IMAGE_LOWERCASE }}
          tag: ${{ steps.version.outputs.idrive_version }}

      # Check the base image against the current IDrive version tag (not :latest, which
      # lags behind by LATEST_MIN_AGE_DAYS and would otherwise rebuild on every daily run).
      - name: Check for new base image
        if: >-
          github.event_name != 'push' &&
          github.event_name != 'pull_request' &&
          steps.check-image.outputs.exists == 'true' &&
          steps.check-version.outputs.tag != 'not found'
        id: check-base
        uses: lucacome/docker-image-update-checker@958e0b396cd5227e7da180826286ef48c20296f9 # v3.1.2
        with:
          base-image: debian:trixie-slim
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:${{ steps.version.outputs.idrive_version }}

      # Single source of truth for the build decision; the Build Summary below reads
      # the same outputs rather than restating the condition.
      - name: Decide whether to build
        id: decide
        env:
          REQUESTED: ${{ inputs.promote_version }}
          EVENT: ${{ github.event_name }}
          IMAGE_EXISTS: ${{ steps.check-image.outputs.exists }}
          BASE_STALE: ${{ steps.check-base.outputs.needs-updating }}
          VERSION_TAG: ${{ steps.check-version.outputs.tag }}
        run: |
          build=false
          if   [ -n "$REQUESTED" ];            then reason="rollback request; nothing to build"
          elif [ "$EVENT" = "push" ];          then build=true; reason="push to main"
          elif [ "$EVENT" = "pull_request" ];  then build=true; reason="pull request (test only, no push)"
          elif [ "$EVENT" = "workflow_dispatch" ]; then build=true; reason="manual dispatch"
          elif [ "$IMAGE_EXISTS" = "false" ];  then build=true; reason="image does not exist yet"
          elif [ "$BASE_STALE" = "true" ];     then build=true; reason="base image updated"
          elif [ "$VERSION_TAG" = "not found" ]; then build=true; reason="new iDrive version"
          else reason="no updates available"
          fi
          echo "build=$build"   >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "build=$build ($reason)"

  # Build each architecture on a native runner and run the smoke test before anything
  # is published. ubuntu-24.04-arm is free for public repositories; a private fork
  # without ARM runners can use ubuntu-latest for both (arm64 then runs under QEMU).
  verify:
    name: Smoke test (${{ matrix.arch }})
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.arch }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: IDRIVE_URL=${{ needs.decide.outputs.idrive_URL }}
          tags: idrive-docker:smoke
          load: true

      - name: Smoke test
        run: ./tests/smoke-test.sh idrive-docker:smoke

  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    needs: [decide, verify]
    # verify is skipped when there is nothing to build; promoting :latest must still run then.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.decide.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Sanitize Repository Name
        env:
          RAW_IMAGE_NAME: ${{ github.repository }}
        run: |
          echo "IMAGE_LOWERCASE=$(echo "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          # Bare repo name (no owner), used for the image title label.
          echo "REPO_NAME=${RAW_IMAGE_NAME#*/}" >> "$GITHUB_ENV"

      - name: Check DockerHub Secrets
        id: check-secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Github Packages (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Dynamic Docker Tags
        id: generate-tags
        if: needs.decide.outputs.build == 'true'
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Version tags only. :latest is moved separately, by the promote step below,
          # once the release has aged past LATEST_MIN_AGE_DAYS. version.sh exits
          # non-zero when it cannot resolve a version, so this is never empty.
          # Each repository gets the moving <version> tag and the immutable <version>-r<N>.
          VERSION="${{ needs.decide.outputs.idrive_version }}"
          REV_TAG="$VERSION-r${{ needs.decide.outputs.revision }}"
          REPOS="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}"

          # Append the DockerHub repository only if DockerHub secrets are present
          if [ "${{ steps.check-secrets.outputs.has_secrets }}" = "true" ]; then
            REPOS="$REPOS $DOCKER_USER/$REPO_NAME"
          fi

          TAGS=""
          for repo in $REPOS; do
            # Revision tags never move: refuse to overwrite one that already exists.
            if docker buildx imagetools inspect "$repo:$REV_TAG" >/dev/null 2>&1; then
              echo "::error::$repo:$REV_TAG already exists; refusing to overwrite an immutable revision tag."
              exit 1
            fi
            TAGS="${TAGS:+$TAGS,}$repo:$VERSION,$repo:$REV_TAG"
          done
          # $TAGS is a single comma-separated line, which build-push-action accepts
          # directly — no heredoc needed. build_date is RFC 3339, for
          # org.opencontainers.image.created.
          {
            echo "rev_tag=$REV_TAG"
            echo "tags=$TAGS"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build image and push
        if: needs.decide.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ steps.generate-tags.outputs.tags }}
          # Passed as a buildkit input (not evaluated by a runner shell). version.sh
          # exits non-zero if the URL is unresolved, so we never reach here empty.
          build-args: IDRIVE_URL=${{ needs.decide.outputs.idrive_URL }}
          # OCI image labels. Everything repo-specific derives from the github context
          # rather than being hardcoded, so a fork labels its images with its own
          # repository instead of inheriting the upstream one.
          #
          # `source` is the load-bearing one: Renovate reads it from the published
          # manifest to locate the repository, which is how a consumer's update PR
          # gets release notes for this image. `revision` records which commit of
          # this repo built the image, so `docker inspect` answers "which recipe is
          # this?" even though :<version> is overwritten by later rebuilds.
          labels: |
            org.opencontainers.image.title=${{ env.REPO_NAME }}
            org.opencontainers.image.description=IDrive Linux Client in a Docker container
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.version=${{ steps.generate-tags.outputs.rev_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.generate-tags.outputs.build_date }}
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64

      # Moving :latest is deliberately separate from building, so a version built
      # days ago can still be promoted once it has aged — the build step above does
      # not re-run for a version whose tag already exists.
      - name: Promote :latest
        id: promote
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          MIN="${{ env.LATEST_MIN_AGE_DAYS }}"
          GHCR_REPO="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}"
          REQUESTED="${{ inputs.promote_version }}"

          skip() { echo "promoted=false" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          if [ -n "$REQUESTED" ]; then
            # Explicit rollback/promotion requested by a human. Skip the age gate: the
            # whole point is to move :latest onto a version of their choosing, which
            # for a rollback is deliberately an older one.
            TARGET="$REQUESTED"
            WHY="manual rollback to $TARGET"
          else
            TARGET="${{ needs.decide.outputs.idrive_version }}"
            AGE="${{ needs.decide.outputs.idrive_age_days }}"

            # If :latest does not exist yet there is nothing to protect, so publish it
            # regardless of age. (check-image is skipped on push events, hence the
            # explicit 'false' test rather than a truthiness check.)
            BOOTSTRAP=false
            [ "${{ needs.decide.outputs.image_exists }}" = "false" ] && BOOTSTRAP=true

            if [ "$BOOTSTRAP" = "true" ]; then
              WHY="bootstrap (:latest did not exist)"
            else
              # Unknown age means version.sh could not read the release date. Fail closed:
              # leave :latest on the last known good version rather than guessing.
              [ -z "$AGE" ] && skip "release age unknown; leaving :latest unchanged"
              [ "$AGE" -lt "$MIN" ] && skip "$TARGET is $AGE day(s) old, waiting for $MIN"
              WHY="$TARGET is $AGE day(s) old (>= $MIN)"
            fi
          fi

          # :latest can only point at a manifest that is actually published.
          docker manifest inspect "$GHCR_REPO:$TARGET" >/dev/null 2>&1 \
            || skip "$GHCR_REPO:$TARGET is not published; nothing to point :latest at"

          # Known-bad releases are refused even for an explicit request, so a typo
          # cannot put :latest back onto a version that breaks every backup. To
          # promote one deliberately, remove it from BLOCKED_VERSIONS.
          for bad in ${{ env.BLOCKED_VERSIONS }}; do
            case "$TARGET" in "$bad"|"$bad"-r*) ;; *) continue ;; esac
            skip "$TARGET is listed in BLOCKED_VERSIONS; refusing to promote :latest onto a known-broken release"
          done

          # Re-point the tag at the existing multi-arch manifest. No rebuild, and the
          # amd64/arm64 manifest list is preserved.
          docker buildx imagetools create --tag "$GHCR_REPO:latest" "$GHCR_REPO:$TARGET"
          if [ "${{ steps.check-secrets.outputs.has_secrets }}" = "true" ]; then
            docker buildx imagetools create \
              --tag "$DOCKER_USER/$REPO_NAME:latest" "$DOCKER_USER/$REPO_NAME:$TARGET"
          fi

          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "reason=$WHY" >> "$GITHUB_OUTPUT"
          echo ":latest now points at $TARGET ($WHY)"

      - name: Create GitHub Release
        id: release
        if: needs.decide.outputs.build == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.idrive_version }}
          REV_TAG: ${{ steps.generate-tags.outputs.rev_tag }}
          RELEASE_DATE: ${{ needs.decide.outputs.idrive_release_date }}
          REASON: ${{ needs.decide.outputs.reason }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
        run: |
          {
            echo "- **IDrive for Linux:** \`$VERSION\` (released ${RELEASE_DATE:-unknown})"
            echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:$REV_TAG\` (never moves) and \`:$VERSION\`"
            echo "- **Built because:** $REASON"
            echo "- **\`:latest\` moved here:** ${PROMOTED:-false}"
            echo
          } > release-notes.md
          gh release create "v$REV_TAG" --target "${{ github.sha }}" --title "IDrive $VERSION ($REV_TAG)" \
            --notes-file release-notes.md --generate-notes
          echo "created=v$REV_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "**Event:** ${{ github.event_name }}"
            echo "**iDrive version detected:** ${{ needs.decide.outputs.idrive_version || 'no (version-check failed)' }}"
            echo "**Release date:** ${{ needs.decide.outputs.idrive_release_date || 'unknown' }} (${{ needs.decide.outputs.idrive_age_days || '?' }} days old)"
            echo "**Image already exists:** ${{ needs.decide.outputs.image_exists || 'n/a (push event)' }}"
            echo "**Base image needs updating:** ${{ needs.decide.outputs.base_stale || 'n/a' }}"
            echo "**Existing version tag found:** ${{ needs.decide.outputs.version_tag || 'n/a' }}"
            echo "**Built:** ${{ needs.decide.outputs.build || 'n/a' }} — ${{ needs.decide.outputs.reason || 'step did not run' }}"
            echo "**Revision tag:** ${{ steps.generate-tags.outputs.rev_tag || 'n/a' }} (release: ${{ steps.release.outputs.created || 'none' }})"
            echo "**:latest promoted:** ${{ steps.promote.outputs.promoted || 'n/a' }} — ${{ steps.promote.outputs.reason || 'step did not run' }}"
            echo ""
            echo "_Version tags publish immediately; \`:latest\` waits \`LATEST_MIN_AGE_DAYS=${{ env.LATEST_MIN_AGE_DAYS }}\` days._"
          } >> "$GITHUB_STEP_SUMMARY"
