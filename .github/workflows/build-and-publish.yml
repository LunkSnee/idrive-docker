name: Build and Publish

on:
  push:
    branches: [main]
    paths:
      - "idrive/build/**"
  schedule:
    - cron: "12 9 * * *"
  workflow_dispatch:
    inputs:
      promote_version:
        description: "Roll :latest back to an already-published version tag (e.g. 3.15.0). Bypasses the age gate and skips building. Leave empty for a normal run."
        required: false
        type: string

# Serialize builds so a manual dispatch overlapping the daily schedule can't race
# to push :latest, with the slower run silently winning.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # How many days an iDrive release must have been public before :latest is moved
  # onto it. Version tags are always published immediately; only :latest waits.
  # iDrive has shipped a release whose bundled helper binaries disagreed with the
  # client (3.16.0), so :latest should not follow a brand-new version same-day.
  LATEST_MIN_AGE_DAYS: 7
  # Versions :latest must never be promoted onto, regardless of age. The age gate
  # above only *delays* a release; it cannot know one is broken, so a known-bad
  # version would sail through once it aged past the threshold.
  #
  # 3.16.0: the client invokes its own bundled idevsutil with a --cmd option that
  # helper rejects, so every backup fails. Reproduces on a fresh container with an
  # empty config — see snorre-k/idrive-docker#35. Remove the entry once iDrive
  # ships a fix. Space-separated.
  BLOCKED_VERSIONS: "3.16.0"

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Sanitize Repository Name
        id: sanitize
        env:
          RAW_IMAGE_NAME: ${{ github.repository }}
        run: |
          echo "IMAGE_LOWERCASE=$(echo $RAW_IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          # Bare repo name (no owner), used for the image title label.
          echo "REPO_NAME=${RAW_IMAGE_NAME#*/}" >> $GITHUB_ENV

      - name: Get iDrive version
        id: version
        run: ./idrive/version.sh

      - name: Check DockerHub Secrets
        id: check-secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to Github Packages (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- NEW: Check if the image currently exists in the registry ---
      - name: Check if image exists in GHCR
        id: check-image
        if: github.event_name != 'push'
        run: |
          # Redirects output to null. If it succeeds, the image exists. If it fails, it does not.
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:latest"
          if docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # --- UPDATED: Only run update checkers if the image already exists ---
      - name: Check for new base image
        if: github.event_name != 'push' && steps.check-image.outputs.exists == 'true'
        id: check-base
        uses: lucacome/docker-image-update-checker@958e0b396cd5227e7da180826286ef48c20296f9 # v3.1.2
        with:
          base-image: debian:bookworm-slim
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:latest

      - name: Check for new iDrive version
        if: github.event_name != 'push' && steps.check-image.outputs.exists == 'true'
        id: check-version
        uses: tyriis/docker-image-tag-exists@e73c8fdfab85076cdcf2ce4b443181fae2153675 # v2026.6.0
        with:
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.IMAGE_LOWERCASE }}
          tag: ${{ steps.version.outputs.idrive_version }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Generate Dynamic Docker Tags
        id: generate-tags
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # Version tags only. :latest is moved separately, by the promote step below,
          # once the release has aged past LATEST_MIN_AGE_DAYS. version.sh exits
          # non-zero when it cannot resolve a version, so this is never empty.
          VERSION="${{ steps.version.outputs.idrive_version }}"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}:$VERSION"

          # Append the DockerHub tag only if DockerHub secrets are present
          if [ "${{ steps.check-secrets.outputs.has_secrets }}" == "true" ]; then
            TAGS="$TAGS,$DOCKER_USER/idrive-docker:$VERSION"
          fi

          # $TAGS is a single comma-separated line, which build-push-action accepts
          # directly — no heredoc needed.
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

          # RFC 3339 timestamp for org.opencontainers.image.created
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # --- UPDATED: Trigger build if push, base update, version update, OR missing image ---
      - name: Build image and push
        # A rollback dispatch only re-points a tag, so there is nothing to build.
        if: >
          inputs.promote_version == '' && (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.check-image.outputs.exists == 'false' ||
          steps.check-base.outputs.needs-updating == 'true' ||
          steps.check-version.outputs.tag == 'not found' )
        uses: docker/build-push-action@v7
        with:
          context: idrive/build
          tags: ${{ steps.generate-tags.outputs.tags }}
          # Passed as a buildkit input (not evaluated by a runner shell). version.sh
          # exits non-zero if the URL is unresolved, so we never reach here empty.
          build-args: IDRIVE_URL=${{ steps.version.outputs.idrive_URL }}
          # OCI image labels. Everything repo-specific derives from the github context
          # rather than being hardcoded, so a fork labels its images with its own
          # repository instead of inheriting the upstream one.
          #
          # `source` is the load-bearing one: Renovate reads it from the published
          # manifest to locate the repository, which is how a consumer's update PR
          # gets release notes for this image. `revision` records which commit of
          # this repo built the image, so `docker inspect` answers "which recipe is
          # this?" even though :<version> is overwritten by later rebuilds.
          labels: |
            org.opencontainers.image.title=${{ env.REPO_NAME }}
            org.opencontainers.image.description=IDrive Linux Client in a Docker container
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.version=${{ steps.version.outputs.idrive_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.generate-tags.outputs.build_date }}
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64

      # Moving :latest is deliberately separate from building, so a version built
      # days ago can still be promoted once it has aged — the build step above does
      # not re-run for a version whose tag already exists.
      - name: Promote :latest
        id: promote
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          MIN="${{ env.LATEST_MIN_AGE_DAYS }}"
          GHCR_REPO="${{ env.REGISTRY }}/${{ env.IMAGE_LOWERCASE }}"
          REQUESTED="${{ inputs.promote_version }}"

          skip() { echo "promoted=false" >> $GITHUB_OUTPUT; echo "reason=$1" >> $GITHUB_OUTPUT; echo "$1"; exit 0; }

          if [ -n "$REQUESTED" ]; then
            # Explicit rollback/promotion requested by a human. Skip the age gate: the
            # whole point is to move :latest onto a version of their choosing, which
            # for a rollback is deliberately an older one.
            TARGET="$REQUESTED"
            WHY="manual rollback to $TARGET"
          else
            TARGET="${{ steps.version.outputs.idrive_version }}"
            AGE="${{ steps.version.outputs.idrive_age_days }}"

            # If :latest does not exist yet there is nothing to protect, so publish it
            # regardless of age. (check-image is skipped on push events, hence the
            # explicit 'false' test rather than a truthiness check.)
            BOOTSTRAP=false
            [ "${{ steps.check-image.outputs.exists }}" = "false" ] && BOOTSTRAP=true

            if [ "$BOOTSTRAP" = "true" ]; then
              WHY="bootstrap (:latest did not exist)"
            else
              # Unknown age means version.sh could not read the release date. Fail closed:
              # leave :latest on the last known good version rather than guessing.
              [ -z "$AGE" ] && skip "release age unknown; leaving :latest unchanged"
              [ "$AGE" -lt "$MIN" ] && skip "$TARGET is $AGE day(s) old, waiting for $MIN"
              WHY="$TARGET is $AGE day(s) old (>= $MIN)"
            fi
          fi

          # :latest can only point at a manifest that is actually published.
          docker manifest inspect "$GHCR_REPO:$TARGET" >/dev/null 2>&1 \
            || skip "$GHCR_REPO:$TARGET is not published; nothing to point :latest at"

          # Known-bad releases are refused even for an explicit request, so a typo
          # cannot put :latest back onto a version that breaks every backup. To
          # promote one deliberately, remove it from BLOCKED_VERSIONS.
          for bad in ${{ env.BLOCKED_VERSIONS }}; do
            [ "$TARGET" = "$bad" ] && \
              skip "$TARGET is listed in BLOCKED_VERSIONS; refusing to promote :latest onto a known-broken release"
          done

          # Re-point the tag at the existing multi-arch manifest. No rebuild, and the
          # amd64/arm64 manifest list is preserved.
          docker buildx imagetools create --tag "$GHCR_REPO:latest" "$GHCR_REPO:$TARGET"
          if [ "${{ steps.check-secrets.outputs.has_secrets }}" = "true" ]; then
            docker buildx imagetools create \
              --tag "$DOCKER_USER/idrive-docker:latest" "$DOCKER_USER/idrive-docker:$TARGET"
          fi

          echo "promoted=true" >> $GITHUB_OUTPUT
          echo "reason=$WHY" >> $GITHUB_OUTPUT
          echo ":latest now points at $TARGET ($WHY)"

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "**Event:** ${{ github.event_name }}"
            echo "**iDrive version detected:** ${{ steps.version.outputs.idrive_version || 'no (version-check failed)' }}"
            echo "**Release date:** ${{ steps.version.outputs.idrive_release_date || 'unknown' }} (${{ steps.version.outputs.idrive_age_days || '?' }} days old)"
            echo "**Image already exists:** ${{ steps.check-image.outputs.exists || 'n/a (push event)' }}"
            echo "**Base image needs updating:** ${{ steps.check-base.outputs.needs-updating || 'n/a' }}"
            echo "**Existing version tag found:** ${{ steps.check-version.outputs.tag || 'n/a' }}"
            echo "**Built:** ${{ inputs.promote_version == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check-image.outputs.exists == 'false' || steps.check-base.outputs.needs-updating == 'true' || steps.check-version.outputs.tag == 'not found') }}"
            echo "**:latest promoted:** ${{ steps.promote.outputs.promoted || 'n/a' }} — ${{ steps.promote.outputs.reason || 'step did not run' }}"
            echo ""
            echo "_Version tags publish immediately; \`:latest\` waits \`LATEST_MIN_AGE_DAYS=${{ env.LATEST_MIN_AGE_DAYS }}\` days._"
          } >> $GITHUB_STEP_SUMMARY
